<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mapa Mental Privado</title>
    <!-- Biblioteca Vis.js para renderização do mapa -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* Painel Superior */
        #header {
            background-color: #1e1e2f;
            color: white;
            padding: 15px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-height: 75px;
            width: 100%;
            z-index: 100;
            transition: transform 0.3s ease, margin-top 0.3s ease;
            flex-wrap: wrap;
        }

        #header.oculto {
            margin-top: -90px;
            pointer-events: none;
        }

        h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
        }
        .divisor {
            width: 1px;
            height: 30px;
            background-color: #3d3d5c;
            margin: 0 4px;
        }
        .grupo-controle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a0a0b0;
            font-weight: bold;
        }

        /* Inputs e Controles */
        input, select {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid #3d3d5c;
            background-color: #2b2b3d;
            color: white;
            font-size: 14px;
            outline: none;
        }
        input { width: 170px; }
        select { cursor: pointer; }
        
        /* Botões */
        button {
            padding: 9px 14px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        button.add { background-color: #2ecc71; color: white; }
        button.add:hover { background-color: #27ae60; transform: translateY(-1px); }
        
        button.edit { background-color: #3498db; color: white; }
        button.edit:hover { background-color: #2980b9; transform: translateY(-1px); }
        
        button.delete { background-color: #e74c3c; color: white; }
        button.delete:hover { background-color: #c0392b; transform: translateY(-1px); }

        button.clear { background-color: #8e44ad; color: white; }
        button.clear:hover { background-color: #9b59b6; transform: translateY(-1px); }

        button.toggle-btn { background-color: #555577; color: white; }
        button.toggle-btn:hover { background-color: #666688; }

        /* Botão Flutuante para Abrir Painel */
        #btn-abrir-painel {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 90;
            background-color: #1e1e2f;
            color: white;
            border: 1px solid #3d3d5c;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none;
        }

        /* Tela do Mapa */
        #mapa-container {
            flex: 1;
            width: 100%;
            background-color: #ffffff;
            background-image: radial-gradient(rgba(0,0,0,0.1) 1px, transparent 1px);
            background-size: 25px 25px;
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- Botão flutuante caso o painel seja ocultado -->
    <button id="btn-abrir-painel" onclick="alternarPainel()">⚙️ Mostrar Painel</button>

    <div id="header">
        <h2>🧠 Mapa Creator</h2>
        <div class="divisor"></div>
        
        <!-- Criar Tópicos -->
        <input type="text" id="texto-no" placeholder="Nome do novo plano...">
        
        <!-- Seletor de Cores do Balão -->
        <div class="grupo-controle">
            <span>Borda:</span>
            <select id="cor-seletor">
                <option value="#3498db" style="color: #3498db; font-weight: bold;">Azul</option>
                <option value="#2ecc71" style="color: #2ecc71; font-weight: bold;">Verde</option>
                <option value="#e67e22" style="color: #e67e22; font-weight: bold;">Laranja</option>
                <option value="#9b59b6" style="color: #9b59b6; font-weight: bold;">Roxo</option>
                <option value="#e74c3c" style="color: #e74c3c; font-weight: bold;">Vermelho</option>
                <option value="#f1c40f" style="color: #f1c40f; font-weight: bold;">Amarelo</option>
                <option value="#1abc9c" style="color: #1abc9c; font-weight: bold;">Ciano</option>
                <option value="#34495e" style="color: #34495e; font-weight: bold;">Grafite</option>
            </select>
        </div>
        
        <button class="add" onclick="adicionarNo()">➕ Adicionar</button>
        
        <div class="divisor"></div>

        <!-- Seletor de Mudar a Cor do Fundo -->
        <div class="grupo-controle">
            <span>🎨 Fundo:</span>
            <select id="fundo-seletor" onchange="mudarCorFundo()">
                <option value="#ffffff">Branco</option>
                <option value="#f4f7f6">Cinza Claro</option>
                <option value="#e8f4fd">Azul Soft</option>
                <option value="#1e1e2f">Escuro (Dark)</option>
                <option value="#111116">Preto Total</option>
                <option value="#2c3e50">Azul Petróleo</option>
            </select>
        </div>

        <div class="divisor"></div>
        
        <!-- Edição e Ações -->
        <button class="edit" onclick="editarNo()">✏️ Renomear</button>
        <button class="delete" onclick="removerNo()">❌ Apagar</button>
        <button class="clear" onclick="limparTudo()">🗑️ Limpar Tudo</button>
        
        <div class="divisor"></div>
        <button class="toggle-btn" onclick="alternarPainel()">👁️ Ocultar Painel</button>
    </div>

    <!-- Container do Mapa -->
    <div id="mapa-container"></div>

    <script>
        // Inicializa o nó central
        let nodes = new vis.DataSet([
            { 
                id: 1, 
                label: ' ESTUDOS ', 
                color: { background: '#2c3e50', border: '#2c3e50' }, 
                font: { color: '#ffffff', size: 20, bold: true }, 
                shape: 'box',
                margin: 15
            }
        ]);

        let edges = new vis.DataSet([]);
        let container = document.getElementById('mapa-container');
        let data = { nodes: nodes, edges: edges };
        
        let options = {
            nodes: {
                shape: 'box',
                borderRadius: 10,
                margin: 12,
                font: { size: 15, color: '#2c3e50', face: 'Segoe UI', bold: true },
                borderWidth: 3,
                shadow: { enabled: true, color: 'rgba(0,0,0,0.08)', size: 6, x: 0, y: 3 }
            },
            edges: {
                width: 3,
                smooth: { type: 'cubicBezier', forceDirection: 'horizontal' }
            },
            physics: {
                enabled: true,
                solver: 'barnesHut',
                barnesHut: {
                    gravitationalConstant: -2000,
                    springLength: 100,
                    springConstant: 0.04
                }
            },
            interaction: { hover: true, dragNodes: true, dragView: true, zoomView: true }
        };

        let network = new vis.Network(container, data, options);
        let proximoId = 2;

        // Permite adicionar o balão ao pressionar ENTER no input
        document.getElementById('texto-no').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                adicionarNo();
            }
        });

        // Adicionar novos tópicos
        function adicionarNo() {
            let textoInput = document.getElementById('texto-no');
            let texto = textoInput.value;
            let corEscolhida = document.getElementById('cor-seletor').value;
            
            if (texto.trim() === "") return alert("Digite um texto para o balão!");

            let selecionado = network.getSelectedNodes();
            if (selecionado.length === 0) {
                return alert("Clique em um balão existente na tela para conectá-lo ao novo tópico!");
            }

            let paiId = selecionado[0];

            nodes.add({ 
                id: proximoId, 
                label: ' ' + texto + ' ',
                color: { 
                    border: corEscolhida, 
                    background: '#ffffff',
                    highlight: { border: corEscolhida, background: '#f5f5f5' }
                }
            });
            
            edges.add({ from: paiId, to: proximoId, color: { color: corEscolhida, highlight: corEscolhida } });

            proximoId++;
            textoInput.value = "";
        }

        // Mudar a cor de fundo da área de trabalho
        function mudarCorFundo() {
            let corFundo = document.getElementById('fundo-seletor').value;
            let containerElement = document.getElementById('mapa-container');
            
            containerElement.style.backgroundColor = corFundo;
            
            if (corFundo === "#1e1e2f" || corFundo === "#111116" || corFundo === "#2c3e50") {
                containerElement.style.backgroundImage = "radial-gradient(rgba(255,255,255,0.15) 1px, transparent 1px)";
            } else {
                containerElement.style.backgroundImage = "radial-gradient(rgba(0,0,0,0.1) 1px, transparent 1px)";
            }
        }

        // Editar texto pelo botão
        function editarNo() {
            let selecionado = network.getSelectedNodes();
            if (selecionado.length === 0) return alert("Clique primeiro no balão que você quer editar!");
            abrirEdicaoTexto(selecionado[0]);
        }

        // Duplo clique direto no balão para editar seu texto na hora
        network.on("doubleClick", function (params) {
            if (params.nodes.length > 0) {
                abrirEdicaoTexto(params.nodes[0]);
            }
        });

        // Caixa de texto para renomear
        function abrirEdicaoTexto(noId) {
            let noAtual = nodes.get(noId);
            let novoTexto = prompt("Digite o novo texto para este balão:", noAtual.label.trim());
            if (novoTexto !== null && novoTexto.trim() !== "") {
                nodes.update({ id: noId, label: ' ' + novoTexto + ' ' });
            }
        }

        // Apagar um único balão selecionado
        function removerNo() {
            let selecionado = network.getSelectedNodes();
            if (selecionado.length === 0) return alert("Clique no balão que quer apagar!");
            
            nodes.remove({ id: selecionado[0] });
        }

        // Apagar Todos os Balões (Reset)
        function limparTudo() {
            if (confirm("Deseja mesmo apagar todos os balões e reiniciar o mapa?")) {
                nodes.clear();
                edges.clear();
                
                // Recria apenas o balão inicial
                nodes.add({ 
                    id: 1, 
                    label: ' ESTUDOS ', 
                    color: { background: '#2c3e50', border: '#2c3e50' }, 
                    font: { color: '#ffffff', size: 20, bold: true }, 
                    shape: 'box',
                    margin: 15
                });
                proximoId = 2;
            }
        }

        // Esconder / Mostrar Painel
        function alternarPainel() {
            let header = document.getElementById('header');
            let btnAbrir = document.getElementById('btn-abrir-painel');
            
            if (header.classList.contains('oculto')) {
                header.classList.remove('oculto');
                btnAbrir.style.display = 'none';
            } else {
                header.classList.add('oculto');
                btnAbrir.style.display = 'block';
            }
        }
    </script>
</body>
</html>
