<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMap Pro - Criador de Mapas Mentais</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- html2canvas para exportação em imagem PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Configuração de tema Tailwind -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        .bg-grid-dots {
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        .bg-grid-lines {
            background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                              linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .mindnode {
            touch-action: none;
            transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
        }

        .mindnode.selected {
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.5), 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .mindnode [contenteditable="true"] {
            user-select: text;
            cursor: text;
        }

        .mindnode [contenteditable="true"]:focus {
            outline: 2px solid #0ea5e9;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.15);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-pop {
            animation: fadeIn 0.15s ease-out forwards;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-100 text-slate-800 flex flex-col">

    <!-- Navbar Superior -->
    <header class="h-14 bg-white border-b border-slate-200 px-4 flex items-center justify-between z-20 shadow-sm gap-2">
        <div class="flex items-center gap-3">
            <div class="bg-brand-600 text-white p-2 rounded-lg flex items-center justify-center shadow-md">
                <i class="fa-solid fa-sitemap text-lg"></i>
            </div>
            <div>
                <input id="map-title" type="text" value="Meu Mapa Mental" class="font-bold text-slate-800 text-sm md:text-base bg-transparent border-b border-transparent hover:border-slate-300 focus:border-brand-500 focus:outline-none px-1 transition-all" />
                <p class="text-[10px] md:text-xs text-slate-400 px-1 hidden sm:block">Salvo no navegador</p>
            </div>
        </div>

        <!-- Ações do Mapa -->
        <div class="flex items-center gap-1.5 md:gap-2">
            <button id="btn-add-root" title="Adicionar Novo Balão Principal" class="flex items-center gap-1.5 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg transition-colors shadow-sm">
                <i class="fa-solid fa-star"></i> <span class="hidden md:inline">Balão Principal</span>
            </button>

            <button id="btn-add-child" title="Adicionar Nó Filho (Tab)" class="flex items-center gap-1.5 px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold rounded-lg transition-colors shadow-sm">
                <i class="fa-solid fa-plus"></i> <span class="hidden md:inline">Filho</span>
            </button>
            <button id="btn-add-sibling" title="Adicionar Nó Irmão (Enter)" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition-colors">
                <i class="fa-solid fa-code-branch"></i> <span class="hidden md:inline">Irmão</span>
            </button>
            <button id="btn-delete-node" title="Apagar Nó Selecionado (Delete)" class="flex items-center gap-1.5 px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold rounded-lg transition-colors">
                <i class="fa-solid fa-trash"></i>
            </button>

            <div class="h-6 w-px bg-slate-200 mx-0.5 hidden sm:block"></div>

            <!-- Controles do Canvas -->
            <div class="hidden sm:flex items-center bg-slate-100 rounded-lg p-1">
                <button id="btn-zoom-out" title="Diminuir Zoom" class="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-white rounded transition-all text-xs">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <span id="zoom-level" class="text-xs font-medium text-slate-600 px-2 min-w-[45px] text-center">100%</span>
                <button id="btn-zoom-in" title="Aumentar Zoom" class="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-white rounded transition-all text-xs">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button id="btn-zoom-reset" title="Centralizar Mapa" class="w-7 h-7 flex items-center justify-center text-slate-600 hover:bg-white rounded transition-all text-xs">
                    <i class="fa-solid fa-compress"></i>
                </button>
            </div>

            <div class="h-6 w-px bg-slate-200 mx-0.5"></div>

            <button id="btn-export-png" title="Exportar como Imagem PNG" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition-colors shadow-sm flex items-center gap-1.5">
                <i class="fa-solid fa-download"></i> <span class="hidden md:inline">PNG</span>
            </button>
            <button id="btn-toggle-sidebar" title="Abrir Opções & Estilos" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">
                <i class="fa-solid fa-sliders text-base"></i>
            </button>
        </div>
    </header>

    <!-- Área Principal do Canvas -->
    <div class="relative flex-1 overflow-hidden select-none bg-slate-100" id="viewport">
        <svg id="svg-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-0" style="transform-origin: 0 0;">
            <defs>
                <linearGradient id="line-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#6366f1" />
                    <stop offset="100%" stop-color="#0ea5e9" />
                </linearGradient>
            </defs>
        </svg>

        <div id="mindmap-container" class="absolute inset-0 z-10 bg-grid-dots transition-none" style="transform-origin: 0 0; transform: translate(0px, 0px) scale(1);"></div>

        <div class="absolute bottom-4 left-4 bg-white/80 backdrop-blur-sm border border-slate-200 rounded-xl p-2.5 shadow-md z-20 hidden md:flex items-center gap-4 text-xs text-slate-600">
            <div><kbd class="px-1.5 py-0.5 bg-slate-100 border rounded font-mono">Clique no Balão</kbd> Para Escrever</div>
            <div><kbd class="px-1.5 py-0.5 bg-slate-100 border rounded font-mono">Tab</kbd> Criar Filho</div>
            <div><kbd class="px-1.5 py-0.5 bg-slate-100 border rounded font-mono">Enter</kbd> Criar Irmão</div>
            <div><kbd class="px-1.5 py-0.5 bg-slate-100 border rounded font-mono">Del</kbd> Excluir</div>
        </div>
    </div>

    <!-- Painel Lateral -->
    <aside id="sidebar" class="fixed right-0 top-14 bottom-0 w-80 bg-white border-l border-slate-200 shadow-2xl z-30 transform translate-x-full transition-transform duration-300 ease-in-out p-5 overflow-y-auto flex flex-col gap-6">
        <div class="flex items-center justify-between border-b pb-3">
            <h2 class="font-bold text-slate-800 text-base flex items-center gap-2">
                <i class="fa-solid fa-palette text-brand-600"></i> Personalização
            </h2>
            <button id="btn-close-sidebar" class="text-slate-400 hover:text-slate-600 p-1">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div class="flex flex-col gap-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Nó Selecionado</h3>
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-slate-600 font-medium block mb-1">Cor do Balão</label>
                    <div class="flex items-center gap-2">
                        <input type="color" id="node-bg-color" value="#ffffff" class="w-9 h-9 rounded cursor-pointer border border-slate-200 p-0.5">
                        <span class="text-xs text-slate-500 font-mono" id="node-bg-hex">#FFFFFF</span>
                    </div>
                </div>
                <div>
                    <label class="text-xs text-slate-600 font-medium block mb-1">Cor do Texto</label>
                    <div class="flex items-center gap-2">
                        <input type="color" id="node-text-color" value="#1e293b" class="w-9 h-9 rounded cursor-pointer border border-slate-200 p-0.5">
                        <span class="text-xs text-slate-500 font-mono" id="node-text-hex">#1E293B</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2 mt-1">
                <button id="btn-toggle-bold" class="flex-1 py-1.5 border border-slate-200 rounded text-xs font-bold text-slate-700 hover:bg-slate-50 transition">Negrito (B)</button>
                <button id="btn-toggle-italic" class="flex-1 py-1.5 border border-slate-200 rounded text-xs italic text-slate-700 hover:bg-slate-50 transition">Itálico (I)</button>
            </div>
        </div>

        <div class="flex flex-col gap-3 border-t pt-4">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Fundo da Página</h3>
            <div>
                <label class="text-xs text-slate-600 font-medium block mb-1">Cor de Fundo</label>
                <div class="flex items-center gap-2">
                    <input type="color" id="canvas-bg-color" value="#f1f5f9" class="w-9 h-9 rounded cursor-pointer border border-slate-200 p-0.5">
                    <span class="text-xs text-slate-500 font-mono" id="canvas-bg-hex">#F1F5F9</span>
                </div>
            </div>
            <div>
                <label class="text-xs text-slate-600 font-medium block mb-1">Estilo de Grade</label>
                <select id="select-grid-style" class="w-full text-xs p-2 border border-slate-200 rounded-lg bg-white text-slate-700 focus:outline-none focus:border-brand-500">
                    <option value="dots">Pontilhado</option>
                    <option value="lines">Linhas</option>
                    <option value="none">Sem Grade</option>
                </select>
            </div>
        </div>

        <div class="flex flex-col gap-3 border-t pt-4">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Salvar & Importar</h3>
            <div class="flex flex-col gap-2">
                <button id="btn-save-local" class="w-full py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar no Navegador
                </button>
                <button id="btn-export-json" class="w-full py-2 border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-file-export"></i> Exportar JSON
                </button>
                <label class="w-full py-2 border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition cursor-pointer">
                    <i class="fa-solid fa-file-import"></i> Importar JSON
                    <input type="file" id="input-import-json" accept=".json" class="hidden">
                </label>
                <button id="btn-clear-map" class="w-full py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition mt-2">
                    <i class="fa-solid fa-rotate-left"></i> Reiniciar Mapa
                </button>
            </div>
        </div>
    </aside>

    <!-- Toast Dialog -->
    <div id="modal-toast-dialog" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-2xl z-50 flex items-center gap-3 transition-all duration-300 transform translate-y-10 opacity-0 pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-info-circle text-brand-500 text-base"></i>
        <span id="toast-message">Notificação</span>
    </div>

    <script>
        const state = {
            nodes: [],
            selectedNodeId: null,
            zoom: 1,
            pan: { x: 0, y: 0 },
            isPanning: false,
            panStart: { x: 0, y: 0 },
            isDraggingNode: false,
            draggedNodeId: null,
            dragOffset: { x: 0, y: 0 },
            canvasBgColor: '#f1f5f9',
            gridStyle: 'dots'
        };

        const viewport = document.getElementById('viewport');
        const container = document.getElementById('mindmap-container');
        const svgCanvas = document.getElementById('svg-canvas');
        const sidebar = document.getElementById('sidebar');

        window.onload = function () {
            loadSavedState();
            setupEventListeners();
            render();
            centerMap();
        };

        function createDefaultMap() {
            state.nodes = [
                {
                    id: 'root_' + Date.now(),
                    parentId: null,
                    text: 'Ideia Central',
                    x: window.innerWidth / 2 - 80,
                    y: window.innerHeight / 2 - 80,
                    bgColor: '#6366f1',
                    textColor: '#ffffff',
                    isBold: true,
                    isItalic: false,
                    isRoot: true
                }
            ];
            state.selectedNodeId = state.nodes[0].id;
        }

        function render() {
            container.innerHTML = '';
            
            state.nodes.forEach(node => {
                const nodeEl = createNodeElement(node);
                container.appendChild(nodeEl);
            });

            updateConnections();
            updateSidebarInputs();
        }

        function createNodeElement(node) {
            const el = document.createElement('div');
            el.id = `node-${node.id}`;
            el.className = `mindnode absolute px-4 py-2.5 rounded-xl border border-slate-200/80 shadow-md cursor-grab active:cursor-grabbing max-w-xs break-words animate-pop ${node.id === state.selectedNodeId ? 'selected' : ''}`;
            
            el.style.left = `${node.x}px`;
            el.style.top = `${node.y}px`;
            el.style.backgroundColor = node.bgColor;
            el.style.color = node.textColor;
            el.style.fontWeight = node.isBold ? 'bold' : 'normal';
            el.style.fontStyle = node.isItalic ? 'italic' : 'normal';

            el.innerHTML = `
                <div class="node-text text-sm leading-snug outline-none min-w-[20px]" contenteditable="true" spellcheck="false">${escapeHtml(node.text)}</div>
            `;

            const textEl = el.querySelector('.node-text');

            // Edição em tempo real dentro do balão
            textEl.addEventListener('input', (e) => {
                node.text = e.target.innerText;
                updateConnections();
            });

            textEl.addEventListener('blur', () => {
                saveStateToLocal();
            });

            textEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    textEl.blur();
                }
            });

            el.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                e.stopPropagation();
                selectNode(node.id);
                
                if (e.target !== textEl) {
                    state.isDraggingNode = true;
                    state.draggedNodeId = node.id;
                    state.dragOffset = {
                        x: (e.clientX / state.zoom) - node.x,
                        y: (e.clientY / state.zoom) - node.y
                    };
                }
            });

            return el;
        }

        function updateConnections() {
            const existingPaths = svgCanvas.querySelectorAll('.connector-path');
            existingPaths.forEach(p => p.remove());

            state.nodes.forEach(node => {
                if (!node.parentId) return;
                
                const parent = state.nodes.find(n => n.id === node.parentId);
                if (!parent) return;

                const parentEl = document.getElementById(`node-${parent.id}`);
                const childEl = document.getElementById(`node-${node.id}`);

                if (!parentEl || !childEl) return;

                const pRect = {
                    x: parent.x + parentEl.offsetWidth / 2,
                    y: parent.y + parentEl.offsetHeight / 2
                };
                const cRect = {
                    x: node.x + childEl.offsetWidth / 2,
                    y: node.y + childEl.offsetHeight / 2
                };

                const deltaX = cRect.x - pRect.x;
                const controlX1 = pRect.x + deltaX * 0.5;
                const controlX2 = cRect.x - deltaX * 0.5;

                const pathData = `M ${pRect.x} ${pRect.y} C ${controlX1} ${pRect.y}, ${controlX2} ${cRect.y}, ${cRect.x} ${cRect.y}`;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', pathData);
                path.setAttribute('class', 'connector-path');
                path.setAttribute('stroke', 'url(#line-gradient)');
                path.setAttribute('stroke-width', '2.5');
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke-linecap', 'round');

                svgCanvas.appendChild(path);
            });

            svgCanvas.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;
        }

        function selectNode(id) {
            if (state.selectedNodeId === id) return;
            state.selectedNodeId = id;
            render();
        }

        function addRootNode(customText) {
            const newId = 'root_' + Date.now();
            const newNode = {
                id: newId,
                parentId: null,
                text: customText || 'Novo Balão Principal',
                x: (window.innerWidth / 2 - 80) + (Math.random() * 60 - 30),
                y: (window.innerHeight / 2 - 80) + (Math.random() * 60 - 30),
                bgColor: '#6366f1',
                textColor: '#ffffff',
                isBold: true,
                isItalic: false,
                isRoot: true
            };

            state.nodes.push(newNode);
            selectNode(newId);
            saveStateToLocal();
            showToast('Novo Balão Principal criado!', 'fa-star');
            return newNode;
        }

        function addChildNode(customText, parentId) {
            let targetParentId = parentId || state.selectedNodeId;
            
            if (!targetParentId || state.nodes.length === 0) {
                return addRootNode(customText);
            }

            const parent = state.nodes.find(n => n.id === targetParentId);
            if (!parent) return addRootNode(customText);

            const newId = 'node_' + Date.now() + '_' + Math.floor(Math.random()*1000);
            const existingChildrenCount = state.nodes.filter(n => n.parentId === targetParentId).length;
            const offsetY = (existingChildrenCount) * 60;

            const newNode = {
                id: newId,
                parentId: parent.id,
                text: customText || 'Novo Tópico',
                x: parent.x + 220,
                y: parent.y + offsetY,
                bgColor: '#ffffff',
                textColor: '#1e293b',
                isBold: false,
                isItalic: false
            };

            state.nodes.push(newNode);
            selectNode(newId);
            saveStateToLocal();
            return newNode;
        }

        function addSiblingNode() {
            if (!state.selectedNodeId || state.nodes.length === 0) {
                addRootNode();
                return;
            }

            const current = state.nodes.find(n => n.id === state.selectedNodeId);
            if (!current || !current.parentId) {
                addChildNode();
                return;
            }

            const newId = 'node_' + Date.now();
            const newNode = {
                id: newId,
                parentId: current.parentId,
                text: 'Novo Tópico',
                x: current.x,
                y: current.y + 70,
                bgColor: '#ffffff',
                textColor: '#1e293b',
                isBold: false,
                isItalic: false
            };

            state.nodes.push(newNode);
            selectNode(newId);
            saveStateToLocal();
        }

        function deleteSelectedNode() {
            if (!state.selectedNodeId) return;

            const idsToDelete = new Set();
            function collectIds(id) {
                idsToDelete.add(id);
                state.nodes.filter(n => n.parentId === id).forEach(child => collectIds(child.id));
            }
            collectIds(state.selectedNodeId);

            state.nodes = state.nodes.filter(n => !idsToDelete.has(n.id));
            state.selectedNodeId = state.nodes.length > 0 ? state.nodes[0].id : null;

            render();
            saveStateToLocal();
            showToast('Balão apagado com sucesso.');
        }

        function updateTransform() {
            container.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;
            document.getElementById('zoom-level').textContent = `${Math.round(state.zoom * 100)}%`;
            updateConnections();
        }

        function centerMap() {
            state.zoom = 1;
            state.pan = { x: 0, y: 0 };
            updateTransform();
        }

        function setupEventListeners() {
            viewport.addEventListener('mousedown', (e) => {
                if (e.target === viewport || e.target === svgCanvas || e.target === container) {
                    state.isPanning = true;
                    state.panStart = { x: e.clientX - state.pan.x, y: e.clientY - state.pan.y };
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (state.isPanning) {
                    state.pan.x = e.clientX - state.panStart.x;
                    state.pan.y = e.clientY - state.panStart.y;
                    updateTransform();
                } else if (state.isDraggingNode && state.draggedNodeId) {
                    const node = state.nodes.find(n => n.id === state.draggedNodeId);
                    if (node) {
                        node.x = (e.clientX / state.zoom) - state.dragOffset.x;
                        node.y = (e.clientY / state.zoom) - state.dragOffset.y;
                        
                        const nodeEl = document.getElementById(`node-${node.id}`);
                        if (nodeEl) {
                            nodeEl.style.left = `${node.x}px`;
                            nodeEl.style.top = `${node.y}px`;
                        }
                        updateConnections();
                    }
                }
            });

            window.addEventListener('mouseup', () => {
                if (state.isDraggingNode) saveStateToLocal();
                state.isPanning = false;
                state.isDraggingNode = false;
                state.draggedNodeId = null;
            });

            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 0.08;
                if (e.deltaY < 0) state.zoom = Math.min(state.zoom + zoomFactor, 2.5);
                else state.zoom = Math.max(state.zoom - zoomFactor, 0.3);
                updateTransform();
            }, { passive: false });

            // NAVBAR CONTROLS
            document.getElementById('btn-add-root').onclick = () => addRootNode();
            document.getElementById('btn-add-child').onclick = () => addChildNode();
            document.getElementById('btn-add-sibling').onclick = addSiblingNode;
            document.getElementById('btn-delete-node').onclick = deleteSelectedNode;
            document.getElementById('btn-zoom-in').onclick = () => { state.zoom = Math.min(state.zoom + 0.15, 2.5); updateTransform(); };
            document.getElementById('btn-zoom-out').onclick = () => { state.zoom = Math.max(state.zoom - 0.15, 0.3); updateTransform(); };
            document.getElementById('btn-zoom-reset').onclick = centerMap;

            // SIDEBAR TOGGLE
            const sidebarEl = document.getElementById('sidebar');
            document.getElementById('btn-toggle-sidebar').onclick = () => sidebarEl.classList.toggle('translate-x-full');
            document.getElementById('btn-close-sidebar').onclick = () => sidebarEl.classList.add('translate-x-full');

            // CONTROLES DE ESTILO
            document.getElementById('node-bg-color').addEventListener('input', (e) => {
                const node = getSelectedNode();
                if (node) {
                    node.bgColor = e.target.value;
                    document.getElementById('node-bg-hex').textContent = e.target.value.toUpperCase();
                    render();
                    saveStateToLocal();
                }
            });

            document.getElementById('node-text-color').addEventListener('input', (e) => {
                const node = getSelectedNode();
                if (node) {
                    node.textColor = e.target.value;
                    document.getElementById('node-text-hex').textContent = e.target.value.toUpperCase();
                    render();
                    saveStateToLocal();
                }
            });

            document.getElementById('btn-toggle-bold').onclick = () => {
                const node = getSelectedNode();
                if (node) {
                    node.isBold = !node.isBold;
                    render();
                    saveStateToLocal();
                }
            };

            document.getElementById('btn-toggle-italic').onclick = () => {
                const node = getSelectedNode();
                if (node) {
                    node.isItalic = !node.isItalic;
                    render();
                    saveStateToLocal();
                }
            };

            document.getElementById('canvas-bg-color').addEventListener('input', (e) => {
                state.canvasBgColor = e.target.value;
                document.getElementById('canvas-bg-hex').textContent = e.target.value.toUpperCase();
                viewport.style.backgroundColor = state.canvasBgColor;
                saveStateToLocal();
            });

            document.getElementById('select-grid-style').addEventListener('change', (e) => {
                state.gridStyle = e.target.value;
                container.className = `absolute inset-0 z-10 transition-none ${
                    state.gridStyle === 'dots' ? 'bg-grid-dots' : state.gridStyle === 'lines' ? 'bg-grid-lines' : ''
                }`;
                saveStateToLocal();
            });

            // ATALHOS DE TECLADO
            window.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.getAttribute('contenteditable') === 'true') return;

                if (e.key === 'Tab') {
                    e.preventDefault();
                    addChildNode();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    addSiblingNode();
                } else if (e.key === 'Delete' || e.key === 'Backspace') {
                    e.preventDefault();
                    deleteSelectedNode();
                }
            });

            // GESTÃO DE ARQUIVOS
            document.getElementById('btn-save-local').onclick = () => {
                saveStateToLocal();
                showToast('Mapa mental salvo no navegador!', 'fa-floppy-disk');
            };

            document.getElementById('btn-clear-map').onclick = () => {
                createDefaultMap();
                render();
                centerMap();
                saveStateToLocal();
                showToast('Mapa mental reiniciado.');
            };

            document.getElementById('btn-export-json').onclick = exportJSON;
            document.getElementById('input-import-json').addEventListener('change', importJSON);
            document.getElementById('btn-export-png').onclick = exportPNG;
            document.getElementById('map-title').addEventListener('change', saveStateToLocal);
        }

        function getSelectedNode() {
            return state.nodes.find(n => n.id === state.selectedNodeId);
        }

        function updateSidebarInputs() {
            const node = getSelectedNode();
            if (node) {
                document.getElementById('node-bg-color').value = node.bgColor;
                document.getElementById('node-bg-hex').textContent = node.bgColor.toUpperCase();
                document.getElementById('node-text-color').value = node.textColor;
                document.getElementById('node-text-hex').textContent = node.textColor.toUpperCase();
            }
        }

        function saveStateToLocal() {
            const data = {
                title: document.getElementById('map-title').value,
                nodes: state.nodes,
                canvasBgColor: state.canvasBgColor,
                gridStyle: state.gridStyle
            };
            localStorage.setItem('mindmap_pro_data', JSON.stringify(data));
        }

        function loadSavedState() {
            const saved = localStorage.getItem('mindmap_pro_data');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    document.getElementById('map-title').value = data.title || 'Meu Mapa Mental';
                    state.nodes = data.nodes || [];
                    state.canvasBgColor = data.canvasBgColor || '#f1f5f9';
                    state.gridStyle = data.gridStyle || 'dots';

                    viewport.style.backgroundColor = state.canvasBgColor;
                    document.getElementById('canvas-bg-color').value = state.canvasBgColor;
                    document.getElementById('canvas-bg-hex').textContent = state.canvasBgColor.toUpperCase();
                    document.getElementById('select-grid-style').value = state.gridStyle;
                    
                    if (state.nodes.length > 0) {
                        state.selectedNodeId = state.nodes[0].id;
                    } else {
                        createDefaultMap();
                    }
                } catch(e) {
                    createDefaultMap();
                }
            } else {
                createDefaultMap();
            }
        }

        function exportJSON() {
            const data = {
                title: document.getElementById('map-title').value,
                nodes: state.nodes,
                canvasBgColor: state.canvasBgColor,
                gridStyle: state.gridStyle
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `${data.title.toLowerCase().replace(/\s+/g, '_')}_mindmap.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importJSON(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.nodes && Array.isArray(data.nodes)) {
                        state.nodes = data.nodes;
                        document.getElementById('map-title').value = data.title || 'Mapa Importado';
                        state.selectedNodeId = state.nodes[0]?.id || null;
                        render();
                        centerMap();
                        saveStateToLocal();
                        showToast('Mapa mental importado com sucesso!', 'fa-circle-check');
                    }
                } catch (err) {
                    showToast('Erro ao carregar o arquivo JSON.', 'fa-triangle-exclamation');
                }
            };
            reader.readAsText(file);
        }

        function exportPNG() {
            const selectedEl = document.querySelector('.mindnode.selected');
            if (selectedEl) selectedEl.classList.remove('selected');

            html2canvas(viewport, {
                backgroundColor: state.canvasBgColor,
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `${document.getElementById('map-title').value.toLowerCase().replace(/\s+/g, '_')}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                if (selectedEl) selectedEl.classList.add('selected');
                showToast('Imagem PNG exportada!', 'fa-circle-check');
            });
        }

        function showToast(message, iconClass = 'fa-info-circle') {
            const toast = document.getElementById('modal-toast-dialog');
            const msgEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');

            msgEl.textContent = message;
            iconEl.className = `fa-solid ${iconClass} text-brand-500 text-base`;

            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-10');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-10');
            }, 3200);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
